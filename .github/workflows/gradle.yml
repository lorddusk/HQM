name: Build and test

on:
  push:
    branches: [ "1.21.1" ]
    paths-ignore: [ "**.md", "docs/**" ]
  pull_request:
    branches: [ "1.21.1" ]
    paths-ignore: [ "**.md", "docs/**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.loader }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        loader: [ fabric, neoforge ]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Validates the wrapper jar and caches Gradle and Loom downloads
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/1.21.1' }}

      # Fabric: compiles, builds the jar and runs the gametests. NeoForge: compiles and builds the jar
      - name: Build ${{ matrix.loader }}
        run: ./gradlew :${{ matrix.loader }}:build --stacktrace --console=plain
